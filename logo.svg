<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" width="480" height="100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&amp;display=swap');
    </style>

    <!-- Hexagon base gradient -->
    <linearGradient id="hexGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#EC8E48"/>
      <stop offset="35%" stop-color="#D85A2A"/>
      <stop offset="100%" stop-color="#B84310"/>
    </linearGradient>

    <!-- "Oxi" 3D radial pop -->
    <radialGradient id="oxiGrad" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#FAC07A"/>
      <stop offset="25%" stop-color="#EE9344"/>
      <stop offset="55%" stop-color="#D85A2A"/>
      <stop offset="100%" stop-color="#B84310"/>
    </radialGradient>

    <!-- "vend" metallic brush texture -->
    <linearGradient id="vendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="8%" stop-color="#1A1A1A"/>
      <stop offset="16%" stop-color="#505050"/>
      <stop offset="24%" stop-color="#1A1A1A"/>
      <stop offset="32%" stop-color="#3A3A3A"/>
      <stop offset="40%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#2A2A2A"/>
      <stop offset="58%" stop-color="#0A0A0A"/>
      <stop offset="66%" stop-color="#383838"/>
      <stop offset="74%" stop-color="#1A1A1A"/>
      <stop offset="82%" stop-color="#454545"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>

    <!-- Glow filter for the "i" dot -->
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


  </defs>

  <!-- ====== HEXAGON BADGE WITH CIRCUIT TRACES ====== -->
  <g transform="translate(0, 2)">
    <!-- Hexagon body -->
    <path d="M 45 14 L 74.4 31 L 74.4 65 L 45 82 L 15.6 65 L 15.6 31 Z"
          fill="url(#hexGrad)"/>

    <!-- Engraved border highlight -->
    <path d="M 45 14 L 74.4 31 L 74.4 65 L 45 82 L 15.6 65 L 15.6 31 Z"
          fill="none" stroke="#F4B884" stroke-width="0.4" opacity="0.5"/>

    <!-- Circuit traces – left panel -->
    <g stroke="#D4883A" stroke-width="0.7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <!-- Top-left cluster -->
      <path d="M 20 24 L 26 24 L 30 28"/>
      <path d="M 17 32 L 24 32 L 27 35"/>
      <path d="M 22 18 L 28 18 L 32 22"/>
      <!-- Mid-left vertical bus -->
      <path d="M 19 42 L 28 42"/>
      <path d="M 19 48 L 26 48 L 30 44"/>
      <path d="M 22 54 L 28 54"/>
      <!-- Bottom-left cluster -->
      <path d="M 17 60 L 24 60 L 27 57"/>
      <path d="M 20 68 L 26 68 L 30 64"/>
      <path d="M 23 74 L 28 74 L 32 70"/>

      <!-- Right panel -->
      <path d="M 70 26 L 64 26 L 60 30"/>
      <path d="M 73 34 L 66 34 L 62 38"/>
      <path d="M 68 20 L 62 20 L 58 24"/>
      <!-- Mid-right vertical bus -->
      <path d="M 71 44 L 62 44"/>
      <path d="M 71 50 L 64 50 L 60 46"/>
      <path d="M 68 56 L 62 56"/>
      <!-- Bottom-right cluster -->
      <path d="M 73 62 L 66 62 L 62 58"/>
      <path d="M 70 70 L 64 70 L 60 66"/>
      <path d="M 67 76 L 62 76 L 58 72"/>

      <!-- Horizontal bridge traces -->
      <path d="M 32 22 L 36 22"/>
      <path d="M 32 64 L 36 64"/>
      <path d="M 54 22 L 58 22"/>
      <path d="M 54 64 L 58 64"/>
    </g>

    <!-- Via dots (PCB mounting points) -->
    <g fill="#E8A040" opacity="0.9">
      <circle cx="20" cy="24" r="1.3"/>
      <circle cx="17" cy="32" r="1.3"/>
      <circle cx="22" cy="18" r="1.3"/>
      <circle cx="19" cy="42" r="1.3"/>
      <circle cx="19" cy="48" r="1.3"/>
      <circle cx="22" cy="54" r="1.3"/>
      <circle cx="17" cy="60" r="1.3"/>
      <circle cx="20" cy="68" r="1.3"/>
      <circle cx="23" cy="74" r="1.3"/>

      <circle cx="70" cy="26" r="1.3"/>
      <circle cx="73" cy="34" r="1.3"/>
      <circle cx="68" cy="20" r="1.3"/>
      <circle cx="71" cy="44" r="1.3"/>
      <circle cx="71" cy="50" r="1.3"/>
      <circle cx="68" cy="56" r="1.3"/>
      <circle cx="73" cy="62" r="1.3"/>
      <circle cx="70" cy="70" r="1.3"/>
      <circle cx="67" cy="76" r="1.3"/>
    </g>

    <!-- Via rings (golden ring around vias) -->
    <g fill="none" stroke="#F4B884" stroke-width="0.3" opacity="0.5">
      <circle cx="20" cy="24" r="1.8"/>
      <circle cx="17" cy="32" r="1.8"/>
      <circle cx="22" cy="18" r="1.8"/>
      <circle cx="19" cy="42" r="1.8"/>
      <circle cx="19" cy="48" r="1.8"/>
      <circle cx="22" cy="54" r="1.8"/>
      <circle cx="17" cy="60" r="1.8"/>
      <circle cx="20" cy="68" r="1.8"/>
      <circle cx="23" cy="74" r="1.8"/>
      <circle cx="70" cy="26" r="1.8"/>
      <circle cx="73" cy="34" r="1.8"/>
      <circle cx="68" cy="20" r="1.8"/>
      <circle cx="71" cy="44" r="1.8"/>
      <circle cx="71" cy="50" r="1.8"/>
      <circle cx="68" cy="56" r="1.8"/>
      <circle cx="73" cy="62" r="1.8"/>
      <circle cx="70" cy="70" r="1.8"/>
      <circle cx="67" cy="76" r="1.8"/>
    </g>

    <!-- IC chip silhouette on the hexagon -->
    <rect x="29" y="60" width="8" height="6" rx="0.8" fill="#C04E1A" opacity="0.5"/>
    <rect x="29" y="60" width="8" height="6" rx="0.8" fill="none" stroke="#F4B884" stroke-width="0.3" opacity="0.4"/>
    <line x1="31" y1="60" x2="31" y2="58" stroke="#F4B884" stroke-width="0.4" opacity="0.4"/>
    <line x1="34" y1="60" x2="34" y2="58" stroke="#F4B884" stroke-width="0.4" opacity="0.4"/>
    <line x1="31" y1="66" x2="31" y2="68" stroke="#F4B884" stroke-width="0.4" opacity="0.4"/>
    <line x1="34" y1="66" x2="34" y2="68" stroke="#F4B884" stroke-width="0.4" opacity="0.4"/>

    <!-- Key icon (from key-svgrepo-com.svg) -->
    <g transform="translate(15, 18) scale(2.5)">
      <g transform="rotate(-45, 12, 12)">
        <path d="M15 9H15.01M15 15C18.3137 15 21 12.3137 21 9C21 5.68629 18.3137 3 15 3C11.6863 3 9 5.68629 9 9C9 9.27368 9.01832 9.54308 9.05381 9.80704C9.11218 10.2412 9.14136 10.4583 9.12172 10.5956C9.10125 10.7387 9.0752 10.8157 9.00469 10.9419C8.937 11.063 8.81771 11.1823 8.57913 11.4209L3.46863 16.5314C3.29568 16.7043 3.2092 16.7908 3.14736 16.8917C3.09253 16.9812 3.05213 17.0787 3.02763 17.1808C3 17.2959 3 17.4182 3 17.6627V19.4C3 19.9601 3 20.2401 3.10899 20.454C3.20487 20.6422 3.35785 20.7951 3.54601 20.891C3.75992 21 4.03995 21 4.6 21H6.33726C6.58185 21 6.70414 21 6.81923 20.9724C6.92127 20.9479 7.01881 20.9075 7.10828 20.8526C7.2092 20.7908 7.29568 20.7043 7.46863 20.5314L12.5791 15.4209C12.8177 15.1823 12.937 15.063 13.0581 14.9953C13.1843 14.9248 13.2613 14.8987 13.4044 14.8783C13.5417 14.8586 13.7588 14.8878 14.193 14.9462C14.4569 14.9817 14.7263 15 15 15Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- ====== WORDMARK ====== -->
  <text x="90" y="78" font-family="Poppins, system-ui, -apple-system, sans-serif" font-size="78" font-weight="700">
    <tspan fill="url(#oxiGrad)">Oxi</tspan><tspan fill="url(#vendGrad)">vend</tspan>
  </text>

  <!-- Glowing "i" dot (hexagon branded) -->
  <g transform="translate(181, 18)">
    <circle cx="0" cy="0" r="6" fill="#EE9344" filter="url(#glow)" opacity="0.5"/>
    <path d="M 0 -5 L 4.3 -2.5 L 4.3 2.5 L 0 5 L -4.3 2.5 L -4.3 -2.5 Z"
          fill="url(#oxiGrad)"/>
  </g>
</svg>
